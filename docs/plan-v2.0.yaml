实测项设计:   # 批次 A 执行，沿用 _amis-lab；判定方法同 V-2（比对前端 loading 时刻与终端响应日志 / 提交后新增 GET 日志）
  - {id: V-4, 项: 权限位注入链路——page 级 data 声明 perm:{add:false} 后，深层按钮 visibleOn 是否能取到（取值域链验证）, 方法: page data 注入权限位 + crud headerToolbar 按钮 visibleOn，翻转布尔观察渲染}
  - {id: V-5, 项: visibleOn:false 的按钮是完全不渲染还是隐藏占位；与 hidden、disabledOn 三者渲染差异, 方法: 同一按钮三种写法对照，DevTools 查 DOM 存在性}
  - {id: V-6, 项: 字段级权限关键坑——disabled 的表单项提交时值是否仍随 payload 上送（决定「只读」该用 disabled 还是 static 还是隐藏）, 方法: input-text disabledOn 置真，DevTools 看 POST body 是否含该字段, 源码已证: 'formItem.validate() 无 disabled 跳过逻辑——disabled 字段仍参与校验，若为必填且空值会拦截提交（直接影响 PM-03 推荐写法）', 待实测: 值是否随 payload 上送}
  - {id: V-7, 项: operation 行内按钮 visibleOn/disabledOn 的行上下文取值（this.xxx 是否可用）, 方法: crud 行内按钮 disabledOn: "this.status === 0"}
  - {id: V-8, 项: 字段只读态 staticOn 与 disabled 的提交行为差异（static 值是否上送、展示差异）, 方法: 同 V-6 对照组}
  - {id: V-9, 项: bulkActions 弹层内按钮的权限表达式取值域（弹层内是否还能读到外层 Service 权限位）, 方法: bulk-actions-picker.json 基础上加 visibleOn 引用外层权限位}
  - {id: V-10, 项: 盲区补测——bulk-actions-picker 的 ajax 按钮 "reload":"mainCrud"（指向 name）是否触发 crud 刷新, 方法: V-2 判定法，选择器提交后看终端是否新增 GET /api/mock2/sample, 追加对照: ['① close:true 与 reload 的时序——先刷新后关窗还是关窗后仍可定位，比对终端 GET 日志与弹层关闭先后', '② actionType:"reload" 的按钮上写 reload 属性是否等价于写 target——决定 D-12 正文是否必须分两列']}

