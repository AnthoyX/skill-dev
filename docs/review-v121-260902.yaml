# ---------------------------------------------------------------- 6. 待实测（V-13 候选）

# 已于 2026-09-03 全部完成，结论见 docs/verify-lab-260903.yaml
pending_verify:
  - id: V-13-A
    rule: D-06（form onEvent.submit 会拦截内置提交）
    result: '成立，升「已实测」：接口零请求 + submitSucc 不触发 + 弹层不关闭；源码推断被实测推翻'
    risk: 高——后果严重（接口不调用 / submitSucc 不触发 / loading 卡死）且机制存疑
    doubt: |
      源码显示事件动作须显式 preventDefault:true 才阻止默认行为：
      l.preventDefault ? evalExpressionWithConditionBuilderAsync(l.preventDefault,g,!1) : ...
      与「默认拦截」的说法不符
    method: close:false 弹层 + form onEvent.submit 配一条无害动作（如 toast），观察接口是否发出
  - id: V-13-B
    rule: A-01（crud 内 setValue 不向外传播）
    result: 'A-01 修正后升「已实测」、D-09 升「已实测」：不带 componentId 落在按钮自身域（三处全读不到），指向 Service 时 headerToolbar 可读但行内只拿初始值'
    risk: 中——是 D-09（Service 包层）的唯一依据，至今未实测
    method: crud headerToolbar 按钮 setValue 到自身数据域 vs 到 Service，对比 loadingOn 是否读到
  - id: V-13-C
    rule: C-04（statistics 在 total <= perPage 时不渲染）
    result: '成立，升「已实测」：total=5 时 statistics 节点完全不存在，total=171 正常渲染；tpl 替代方案单页下正常'
    risk: 低——结论「改用 tpl」无论真伪都安全
    note: 官方 crud defaultProps 是 footerToolbar:["statistics","pagination"]，实测后需补一句「为何覆盖官方默认」

