# ---------------------------------------------------------------- 1. P0 确凿错误

p0:
  - id: ERR-01
    loc: references/data-source.md §2 / A-02
    claim: 括注「adapter 也能识别但禁止混用」
    fact: |
      rest.js: adapter 出现 0 次 / adaptor 出现 6 次
      sdk.js: adapter 共 5 处，全部是 axios 内部配置
             （axios/lib/adapters/xhr.js、e.adapter||d.adapter），与 amis api 无关
    impact: A-02 与 F-10（adapter 不可用·报 invalid label）直接矛盾，A-02 为错方
    fix:
      删: A-02 括注「（adapter 也能识别但禁止混用）」
      改为: '非 amis 标准响应必须用 adaptor 转换（6.13.0 仅识别 adaptor；adapter 为常见误拼，写了完全无效）'

  - id: ERR-02
    loc: references/form-controls.md §1 / F-01
    claim: 多选必带四件套 multiple + extractValue + joinValues + delimiter，否则提交数组
    fact: 'sdk.js select defaultProps = {delimiter:",", valueField:"value", labelField:"label", joinValues:!0, extractValue:!1}'
    impact:
      - joinValues / delimiter 是默认值 → 写出来纯冗余
      - extractValue 不决定"是否拼接"，只在 joinValues:false 时决定数组元素是 value 还是整个选项
      - 不写四件套不会提交数组；仅 joinValues:false 才会
      - 与 F-02「勿写冗余配置」精神自相矛盾
    fix:
      规则改为: |
        F-01 多选 select：必须 multiple:true，且保持 joinValues 为默认 true（显式设 false 会提交数组）；
        delimiter（默认 ","）与 extractValue 按需写，非必需
        来源:实战观察+select源码(2026-09-02)|状态:据源码|版本:6.13.0|后果:joinValues:false 时提交数组，后端解析失败
      连带: examples/crud-base.json 的 country select 可精简为仅 multiple（冗余项不影响功能，可选）

