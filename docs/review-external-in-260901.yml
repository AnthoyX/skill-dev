# =====================================================================
# amis-helper skill 评审反馈
# 评审对象: clawhub.ai/anthoyx/skills/amis-helper
# 版本基准: frontmatter 1.2.0 (2026-08-31) / ClawHub 发布版 0.1.1
# 评审范围: 全部 18 个文件（SKILL.md / META.md / skill-card.md /
#           CHANGELOG.md / examples/INDEX.md + 6 json / references/ 6 md）
# 评审日期: 2026-09-01
# =====================================================================

结论摘要: >-
  工程质量在社区 skill 中属头部水平：SSOT 规则 ID 体系、可信度三级分级、
  实测编号留痕、症状→ID 反向排障索引均为稀缺实践。核心规则链
  （D-01/D-04/D-05/D-08 四条已实测）扎实。主要风险：F-02 可能是误导性规则、
  D-11 未实测却撑起半个刷新体系、7 处一致性小 bug。
  建议修复优先级: F-02复核 > D-11实测 > 示例盲区清理 > 计数/版本号对齐。

# ---------------------------------------------------------------------
# 一、Bug / 不一致（7 条，建议修复）
# ---------------------------------------------------------------------
bugs:
  - id: B1
    标题: 版本号三处打架
    位置: SKILL.md:4 (1.2.0) vs ClawHub发布版 (0.1.1) vs skill-card.md:58
    现象: >-
      skill-card.md:58 自己标注了矛盾 "artifact frontmatter and changelog
      report 1.2.0"。发布版本与内部版本不对齐，核对更新时困惑。
    建议: ClawHub 发布版本跟随 frontmatter，或 frontmatter 增加说明字段

  - id: B2
    标题: self-check 计数与实际不符
    位置: CHANGELOG.md:10 vs references/self-check.md
    现象: >-
      CHANGELOG 声称 "6 组 32 条"，实际 33 个 checkbox——C-02 出现两次
      （第2组:13行、第6组:54行，措辞几乎相同）。同 ID 重复自检也违反 SSOT 精神。
    建议: 第 6 组只留 D-11，删除重复的 C-02 条目

  - id: B3
    标题: P-13 属性名与权威定义混淆
    位置: references/pitfalls.md:48 vs references/crud.md:24 (C-01)
    现象: >-
      P-13 写 "属性名 perPageOptions 不存在"，而权威规则 C-01 定义的是
      perPageAvailable。两个成因（属性名错 / 位置错）混在一句，读者排障时
      会疑惑错误属性到底是什么。
    建议: 拆成两条症状，或明确写 "正确属性名见 C-01 的 perPageAvailable"

  - id: B4
    标题: dialog-form-edit.json 与 F-08 示范写法不一致
    位置: examples/dialog-form-edit.json:34-35 vs references/form-controls.md:58 (F-08)
    现象: >-
      code 的 static 带 value:"${code}"，name 的 static 不带 value。
      F-08 权威写法是 static 必带 value:"${xx}"。
    建议: 统一带 value；若故意展示两种写法需加说明

  - id: B5
    标题: 示例内含作者自标"勿套用"的盲区配置
    位置: examples/bulk-actions-picker.json:45 vs examples/INDEX.md:17-18
    现象: >-
      INDEX.md 承认 "reload: mainCrud 是 ajax 按钮属性，属规则盲区，v2.0
      待补，勿套用"。号称可直接落地的示例片段携带作者未验证语义的配置，
      AI 复制时会连带带走。
    建议: 盲区补齐前改用已验证写法（事件动作 reload），或去掉该属性

  - id: B6
    标题: bulk-actions-picker.json 的 adaptor 缺 total
    位置: examples/bulk-actions-picker.json:17
    现象: >-
      adaptor 只转 items 不转 total。loadDataOnce 全量模式可用，但与
      crud-base.json 的 adaptor 模式（带 total）不一致；用户改为非
      loadDataOnce 模式时会静默出错。
    建议: adaptor 补 "total: payload.data.length"

  - id: B7
    标题: skill-card.md 的 artifact/ 前缀是本地死链
    位置: skill-card.md:38-44
    现象: >-
      References 指向 artifact/META.md 等，但 zip 解压后无 artifact/ 目录
      （文件在根目录），本地用户点击即 404。
    建议: 路径去掉 artifact/ 前缀或注明仅 ClawHub 平台内有效

# ---------------------------------------------------------------------
# 二、规则存疑（3 条，建议实测复核）
# ---------------------------------------------------------------------
规则存疑:
  - id: Q1
    标题: F-02"必填双写"疑似过度设计【最重要】
    位置: references/form-controls.md:28
    现象: >-
      F-02 断言 required:true 只显示红星不拦截，必须配
      validations:{"isRequired":true} 才拦截提交。按 amis 官方语义，
      required:true 本身就是校验属性，提交时拦截并提示。作者标"实战观察"，
      大概率当时是其他原因导致未拦截（按钮未走 form 校验链 / 字段在 combo 内等）。
      若判断有误，这是一条教人写冗余配置的误导性规则，且 dialog-form-add.json:40
      已被传染（照做双写）。
    建议: >-
      在 6.13.0 下做最小复现：纯 form + required:true 的 input-text +
      submit 按钮，验证是否拦截。若拦截则 F-02 降级或删除

  - id: Q2
    标题: D-11 未实测但已进入自检清单
    位置: references/dialog-actions.md:45 (D-11) vs self-check.md:53
    现象: >-
      D-11（close 缺省时 form api 的 reload 生效）标注"据官方文档，未实测"，
      却已被 self-check.md:53 和 crud.md §9 刷新机制表引用。它与已实测的
      D-05（close:false 下 reload 不生效）构成一对边界，是整个刷新体系的
      关键分界。这条不实测，刷新机制表就有一格是猜的。
    建议: 优先补 V-4 实测（与 V-2 同套环境即可）

  - id: Q3
    标题: crud-base.json 的联想 select 隐含前提未声明
    位置: examples/crud-base.json:53-57
    现象: >-
      autoComplete select 未配 labelField/valueField，隐含假设后端返回
      标准 label/value（即 F-09 的协作约束）。示例和 INDEX.md 均未说明前提，
      后端不配合时直接踩 F-10 的坑。
    建议: INDEX.md 宿主依赖列注明 "后端需返回 label/value"

# ---------------------------------------------------------------------
# 三、设计层面建议（3 条）
# ---------------------------------------------------------------------
设计建议:
  - id: S1
    标题: "硬规则索引"名不副实
    位置: SKILL.md:12
    现象: >-
      标题"硬规则索引（违反任意一条=返工）"暗示全集，但 32 条只列了约
      12 个 ID。C-02/C-05/D-05/F-01/F-08 等同样"违反=返工"的关键规则
      未进索引，AI 会默认索引外的不重要。
    建议: 全量列出（每域一行聚合，如 D-01~D-11 → dialog-actions.md），
          或改标题为"高频硬规则 TOP12"

  - id: S2
    标题: 元数据格式小瑕疵
    位置: references/dialog-actions.md:35 (D-01) vs META.md:46
    现象: >-
      D-01 来源写"实战观察+V-1-D实测(2026-08-31)"，与其他已实测规则的
      纯"V-x实测(日期)"格式不统一。
    建议: 统一为"V-x实测"格式，META 清单与各域标注严格对齐

  - id: S3
    标题: 缺"版本升级漂移"应对说明
    位置: META.md
    现象: >-
      规则锚定 6.13.0，但未告知 AI：若用户环境是 6.5 或 7.x，规则可信度
      如何降级、哪些规则（尤其 4 条已实测的）需重新验证。
    建议: META.md 增加"非 6.13.0 环境使用策略"小节

# ---------------------------------------------------------------------
# 四、亮点（值得保持）
# ---------------------------------------------------------------------
亮点:
  - SSOT + 规则 ID 体系: >-
      一条规则一处权威定义，其余只引 ID。全文 32 条经查无跳号、无悬空引用
  - 可信度三级分级: >-
      已实测/据官方文档/实战观察 + 来源|状态|版本|违反后果四要素元数据，
      AI 能自主判断规则可信度
  - 版本锚定与适用边界: >-
      明确排除 amis-editor/2.x/移动端 H5/SSR，避免误用
  - 症状反向索引: >-
      pitfalls.md 16 条"症状→错误写法→ID"设计，排障效率高
  - 实测文化: >-
      1.1.0 版用三组对照实验（V-1/V-1-D/V-2/V-3）推翻自己的 loadingOn
      死配置并留下实测编号与日期，社区 skill 中罕见
  - 敢于标注盲区: >-
      INDEX.md 主动暴露"规则盲区待补"，而非装作完备
  - 示例自洽: >-
      6 个 JSON 严格遵守 R-01（零注释），宿主依赖表清晰

# ---------------------------------------------------------------------
# 五、修复优先级
# ---------------------------------------------------------------------
修复优先级:
  P0: F-02 复核（Q1，可能是误导性规则，已传染示例）
  P1: D-11 实测（Q2，刷新体系关键边界）
  P2: 示例盲区清理（B5/B6）+ F-08 示例对齐（B4）
  P3: 计数/版本号/属性名对齐（B1/B2/B3/B7）+ 设计建议（S1~S3）
