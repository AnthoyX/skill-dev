# ============================================================
# 评审结论（外部 AI 定夺）
# 生成日期: 2026-09-01
# 依据: amis 官方文档 action.md/form.md + amis-core@6.13.0 构建产物源码
#       (esm/store/formItem.js, esm/store/form.js, esm/utils/validations.js) + 项目现状逐条核实
# 状态: 结论已定；需 _amis-lab 实测项已标注 V-x
# ============================================================

Q1:
  结论: F-02 必填双写是冗余教法，应改为「required 单独即可」，删除双写写法
  源码证据:
    - store/formItem.js config(): rules.isRequired = required || rules.isRequired
      → required:true 自动并入 isRequired，双写幂等、无任何增强
    - utils/validations.js isRequired: value!==undefined && value!=='' && value!==null
      && (!Array.isArray(value) || !!value.length)
      → 拦截: undefined/null/''/空数组[]；放行: 0、false；全空格串 ' ' 不拦截
    - store/form.js getItems(): 不排除 hidden/visible=false 字段，全部参与校验
    - store/formItem.js validate(): 无 disabled 跳过逻辑，禁用字段仍校验
  required单独_是否拦截: 是，与 validations.isRequired 完全等价（拦截+红星提示）
  不拦截_已知场景:
    - 按钮 actionType:"ajax" 提交不走 form 校验链，required 完全失效（F-02 最可能起源）
    - 值 0 / false：isRequired 显式放行
    - 值 ' '（全空格）：只排除 ''，不拦截
    - combo/input-table 行内字段：整体提交时行级 required 不校验（官方 issue#9537）
    - 隐藏字段值清空时反向「误拦截」：字段不可见仍报必填
  最小复现_schema: |
    { "type":"page", "body":[ { "type":"form", "api":"/api/mock2/form/saveForm", "body":[
      { "type":"input-text", "name":"a", "label":"A仅required", "required":true },
      { "type":"input-text", "name":"b", "label":"B仅validations", "validations":{"isRequired":true} },
      { "type":"input-number", "name":"c", "label":"C值0", "required":true },
