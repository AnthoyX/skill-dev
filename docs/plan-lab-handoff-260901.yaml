四_待跑实测:

  ## V-11 —— required 校验链（验证 F-02 是否冗余 + 挖 P-17/P-18）
  判定目标:
    - required:true 单独是否拦截提交并提示（与 validations.isRequired 是否等价）
    - ajax 按钮提交是否跳过 form 校验链（这是 F-02 当年误判的最可能起源）
    - 值 0 / 全空格是否放行
    - hidden 的必填字段是否误拦截（P-17 素材）
  操作: 把下面 schema 整份写入 _amis-lab/schema.json，刷新浏览器，按「轮次」操作
  schema: |
    {
      "type": "page",
      "title": "V-11 required 校验链",
      "body": [
        {
          "type": "alert",
          "level": "info",
          "body": "<div style='font-size:14px;line-height:1.9'><b>轮次 1</b>：A/B 留空、D 不选，点「submit 提交」→ 看 A/B/D 是否都报必填（预期是）<br/><b>轮次 2</b>：A、B 填任意值，C 填 <b>0</b>，D 选一项，E 填<b>一个空格</b>，点「submit 提交」→ 看是否放行、终端有无 POST（预期放行，证明 0 与空格算有值）<br/><b>轮次 3</b>：把 A 清空，点「<b>ajax 提交</b>」→ 看是否<b>不打校验直接发 POST</b>（预期直接发，这是 F-02 起源）<br/><b>轮次 4</b>：直接点下面第二个表单的提交 → 看隐藏必填字段是否误拦截（预期拦截 → P-17）</div>",
          "className": "mb-3"
        },
        {
          "type": "form",
          "id": "formMain",
          "api": { "method": "post", "url": "/api/mock2/form/saveForm?waitSeconds=1" },
          "body": [
            { "type": "input-text", "name": "a", "label": "A 仅 required:true", "required": true },
            { "type": "input-text", "name": "b", "label": "B 仅 validations.isRequired", "validations": { "isRequired": true } },
            { "type": "input-number", "name": "c", "label": "C required:true（填 0 测试放行）", "required": true },
            { "type": "select", "name": "d", "label": "D required:true + multiple（不选=空数组）", "multiple": true, "required": true, "options": [{ "label": "x", "value": "x" }] },
            { "type": "input-text", "name": "e", "label": "E required:true（填一个空格测试放行）", "required": true }
          ],
          "actions": [
            { "type": "button", "label": "submit 提交（走校验链）", "level": "primary", "actionType": "submit" },
            { "type": "button", "label": "ajax 提交（疑不走校验链）", "level": "danger", "actionType": "ajax", "api": { "method": "post", "url": "/api/mock2/form/saveForm?waitSeconds=1" } }
          ]
        },
        { "type": "divider" },
        {
          "type": "tpl",
          "tpl": "<div style='color:#999;margin:8px 0'>下面表单只有一个<b>隐藏的必填字段</b>，直接点提交看是否被拦截（P-17 素材）</div>"
        },
        {
          "type": "form",
          "id": "formHidden",
          "api": { "method": "post", "url": "/api/mock2/form/saveForm?waitSeconds=1" },
          "body": [
            { "type": "input-text", "name": "f", "label": "F 隐藏的必填字段", "required": true, "hidden": true },
            { "type": "input-text", "name": "g", "label": "G 普通字段（可留空）" }
          ],
          "actions": [
            { "type": "button", "label": "提交（测隐藏必填是否误拦截）", "level": "primary", "actionType": "submit" }
          ]
        }
      ]
    }
  判定标准:
    - 轮次1: A/B/C/D/E 五个字段**均**出现必填错误提示（C、E 也是 required:true，会一起报错），且终端**无** POST → required 单独有效、与 isRequired 等价
    - 轮次2: 全部放行，终端出现 POST → 0 与全空格均视为有值
