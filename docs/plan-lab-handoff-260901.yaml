# =====================================================================
六_验收标准:
  - 三组实测每组都有终端日志或界面证据，结论是「生效/不生效/条件生效+条件」三选一
  - amis-helper/ 下改动全部完成，无遗漏（对照第五节 10 项逐条打勾）
  - 终检四项: 权威形态唯一性 / 编号连续无跳号 / **悬空引用 = 0** / 全文 CRLF
  - 规则层行数 ≤800（落地后核算一次，报出实际数字）
  - _amis-lab/schema.json 归档到 _amis-lab/schemas/ 下：v11-required.json / v12-close-reload.json / v10-button-reload.json
  - README.md 的归档表格补 3 行

# =====================================================================
七_坑与注意:
  - 数 crud 刷新次数时，页面加载本身会产生第一条 GET，必须**刷新页面重置计数**再测下一组
  - 终端中文乱码：server.py 已强制 UTF-8，若仍乱码用 Windows Terminal
  - amis SDK 分包：vendor/ 下 8 个文件缺一不可，缺 rest.js 会 404 且渲染不全（勿删）
  - 改 amis-helper/ 前先把实测结论落到 docs/ 或本文件，避免实测与改动交叉污染
  - git commit 中文 message 在 PowerShell 会 GBK 乱码 → 用 `git commit -F <UTF-8文件>`

