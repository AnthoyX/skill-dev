<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>amis lab</title>
<link rel="stylesheet" href="vendor/sdk.css" />
<style>
  html, body { margin: 0; padding: 0; }
  #boot { padding: 24px; font: 14px/1.7 system-ui, -apple-system, "Segoe UI", sans-serif; color: #666; }
  #boot.error { color: #c00; }
</style>
</head>
<body>
<div id="root"><div id="boot">正在加载 schema.json ...</div></div>

<script src="vendor/sdk.js"></script>
<script>
// 加时间戳避免浏览器缓存，保证改完 schema.json 刷新即可生效
fetch('schema.json?t=' + Date.now())
  .then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(function (schema) {
    var boot = document.getElementById('boot');
    if (boot) boot.remove();
    amisRequire('amis/embed').embed('#root', schema, {}, {
      // 如需自定义请求器/通知，可在此扩展 env
    });
  })
  .catch(function (e) {
    var boot = document.getElementById('boot');
    if (boot) {
      boot.className = 'error';
      boot.textContent = '加载 schema.json 失败：' + e.message;
    }
    console.error(e);
  });
</script>
</body>
</html>
