<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>amis lab</title>
<link rel="stylesheet" href="vendor/sdk.css" />
<style>
  html, body { margin: 0; padding: 0; }
  #boot { padding: 24px; font: 14px/1.7 system-ui, -apple-system, "Segoe UI", sans-serif; color: #666; }
  #boot.error { color: #c00; }
</style>
</head>
<body>
<div id="root"><div id="boot">正在加载 schema.json ...</div></div>

<script src="vendor/sdk.js"></script>
<script>
// 加时间戳避免浏览器缓存，保证改完 schema.json 刷新即可生效
fetch('schema.json?t=' + Date.now())
  .then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(function (schema) {
    var boot = document.getElementById('boot');
    if (boot) boot.remove();
    amisRequire('amis/embed').embed('#root', schema, {}, {
      // D-02 验证：模拟真实项目的全局 auth fetcher，向所有 amis 发起的请求注入 Authorization
      // （裸 fetch() 在 custom action 里绕过它，故无 token —— 这正是 D-02 的区分点）
      fetcher: function (config) {
        var c = config.config || {};
        var headers = {};
        if (c.headers) { for (var k in c.headers) { headers[k] = c.headers[k]; } }
        headers['Authorization'] = 'Bearer lab-token-xyz';
        var method = (config.method || 'get').toUpperCase();
        var init = { method: method, headers: headers };
        var d = config.data;
        var isForm = (typeof FormData !== 'undefined' && d instanceof FormData);
        if (isForm) {
          // FormData 必须原样透传，且不要设 Content-Type——让浏览器自动补 multipart boundary
          delete headers['Content-Type'];
          delete headers['content-type'];
        }
        if (d !== undefined && method !== 'GET' && method !== 'HEAD') {
          init.body = (isForm || d instanceof Blob || d instanceof File || typeof d === 'string')
            ? d : JSON.stringify(d);
        }
        return fetch(config.url, init).then(function (resp) {
          if (config.responseType === 'blob' || (c.responseType === 'blob')) {
            return resp.blob().then(function (b) {
              return { data: b, status: resp.status, statusText: resp.statusText };
            });
          }
          return resp.text().then(function (txt) {
            var data; try { data = txt ? JSON.parse(txt) : ''; } catch (e) { data = txt; }
            return { data: data, status: resp.status, statusText: resp.statusText };
          });
        });
      }
    });
  })
  .catch(function (e) {
    var boot = document.getElementById('boot');
    if (boot) {
      boot.className = 'error';
      boot.textContent = '加载 schema.json 失败：' + e.message;
    }
    console.error(e);
  });
</script>
</body>
</html>
